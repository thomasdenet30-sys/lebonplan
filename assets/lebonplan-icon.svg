<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="LEBONPLAN icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C2418"/>
      <stop offset="1" stop-color="#06120C"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3DF089"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)" stroke="#1E5A3A" stroke-width="3"/>
  <!-- lightning = faille prix / plan éclair -->
  <path filter="url(#g)" fill="url(#bolt)"
        d="M300 96 L168 288 L242 288 L212 416 L352 214 L272 214 Z"/>
</svg>
